name: video-compressor

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "15672:15672"

  garage:
    image: dxflrs/garage:v2.3.0
    volumes:
      - ../garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    ports:
      - "3900:3900"

  garage-init:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: garage-init
    environment:
      S3_BUCKET: video-compressor
      S3_REGION: garage
      S3_ENDPOINT: http://garage:3900
      GARAGE_ADMIN_TOKEN: dev-admin-token-2f8a4c6e
    volumes:
      - garage-creds:/run/garage-creds
    depends_on:
      - garage

  db-init:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: db-init
    env_file: ../app.env
    volumes:
      - database:/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    env_file: ../app.env
    ports:
      - "3000:3000"
    volumes:
      - garage-creds:/run/garage-creds:ro
      - database:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: worker
    env_file: ../app.env
    volumes:
      - garage-creds:/run/garage-creds:ro
      - database:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:5173/api
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  garage-data:
  garage-creds:
  database:
